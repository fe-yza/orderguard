[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orderguard"
version = "0.1.0"
description = "Real-time delivery failure prediction and intervention system (synthetic marketplace simulation)"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/orderguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
