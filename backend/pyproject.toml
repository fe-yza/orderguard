[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orderguard"
version = "0.1.0"
description = "Real-time delivery failure prediction and intervention system (synthetic marketplace simulation)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/orderguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends(...) as a default argument is the documented, idiomatic
# pattern for dependency injection — not the mutable-default-argument bug
# B008 warns about elsewhere.
"src/orderguard/api/**" = ["B008"]
