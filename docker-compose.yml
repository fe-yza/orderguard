services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: orderguard
      POSTGRES_PASSWORD: orderguard
      POSTGRES_DB: orderguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderguard"]
      interval: 2s
      timeout: 5s
      retries: 15

  backend:
    build: ./backend
    environment:
      ORDERGUARD_DATABASE_URL: postgresql+psycopg://orderguard:orderguard@postgres:5432/orderguard
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
